<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,240,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Main Content -->
  <g filter="url(#glow)">
    <!-- Title -->
    <text x="600" y="150" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="2">
      SATYAM YADAV
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="500" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      Full Stack Developer
    </text>
    
    <!-- Description -->
    <text x="600" y="320" font-family="Arial, sans-serif" font-size="32" fill="#b0b0b0" text-anchor="middle">
      Engineering high-performance systems
    </text>
    
    <!-- Tech Stack Tags -->
    <rect x="300" y="380" width="200" height="60" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="2" rx="8"/>
    <text x="400" y="420" font-family="Arial, sans-serif" font-size="20" fill="#00f0ff" text-anchor="middle" font-weight="bold">React • Next.js</text>
    
    <rect x="600" y="380" width="200" height="60" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="2" rx="8"/>
    <text x="700" y="420" font-family="Arial, sans-serif" font-size="20" fill="#00f0ff" text-anchor="middle" font-weight="bold">Tailwind • Motion</text>
    
    <rect x="900" y="380" width="200" height="60" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="2" rx="8"/>
    <text x="1000" y="420" font-family="Arial, sans-serif" font-size="20" fill="#00f0ff" text-anchor="middle" font-weight="bold">Full Stack Dev</text>
  </g>
  
  <!-- Corner Accents -->
  <line x1="50" y1="50" x2="150" y2="50" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>
  <line x1="50" y1="50" x2="50" y2="150" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>
  
  <line x1="1150" y1="580" x2="1050" y2="580" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>
  <line x1="1150" y1="580" x2="1150" y2="480" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>
  
  <!-- Footer -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="18" fill="#666666" text-anchor="middle">
    Portfolio built with Next.js 16 • Tailwind CSS • Framer Motion
  </text>
</svg>